<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PAN Card</title>
<style>
    * {
        box-sizing: border-box;
    }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        margin: 0;
        padding: 20px;
        color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
    }
    .container {
        background: rgba(0,0,0,0.35);
        padding: 30px 40px;
        border-radius: 12px;
        box-shadow: 0 12px 25px rgba(0,0,0,0.3);
        width: 100%;
        max-width: 700px; /* Increased width for better content display */
    }
    h1 {
        margin-top: 0;
        text-align: center;
        font-weight: 700;
        letter-spacing: 2px;
        margin-bottom: 30px;
    }
    label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        font-size: 0.9rem;
    }
    input[type="text"],
    input[type="date"],
    input[type="file"] {
        width: 100%;
        padding: 10px 12px;
        font-size: 1rem;
        border: none;
        border-radius: 6px;
        margin-bottom: 20px;
        outline: none;
        transition: box-shadow 0.2s ease;
        background: white;
        color: #333;
    }
    input[type="text"]:focus,
    input[type="date"]:focus,
    input[type="file"]:focus {
        box-shadow: 0 0 6px #b4a7e0;
    }
    button {
        width: 100%;
        background: #4e54c8;
        background: linear-gradient(135deg, #4e54c8, #8f94fb);
        border: none;
        outline: none;
        padding: 15px 0;
        font-size: 1.2rem;
        font-weight: 700;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(141,141,255,0.5);
        transition: background 0.3s ease;
    }
    button:hover {
        background: linear-gradient(135deg, #38418e, #686fc9);
    }
    .result {
        margin-top: 30px;
        background: rgba(255,255,255,0.1);
        color: #efefef;
        padding: 20px;
        border-radius: 10px;
        font-weight: 600;
        text-align: left;
        letter-spacing: 1.3px;
        font-size: 1.1rem;
        user-select: all;
        word-wrap: break-word;
    }
    .error {
        margin-bottom: 15px;
        padding: 10px 15px;
        background: #ff4d4d;
        color: white;
        border-radius: 6px;
        font-weight: 600;
        text-align: center;
    }
    #photoPreview {
        margin-top: 10px;
        max-width: 100%;
        max-height: 160px;
        border-radius: 10px;
        object-fit: contain;
        background: #eee;
        display: none;
        border: 2px solid #666;
    }
</style>
</head>
<body>
    <div class="container">
        <h1>PAN Card</h1>
        <label for="fullName">Enter your full name (First Middle Last):</label>
        <input type="text" id="fullName" placeholder="e.g., Rahul Kumar Sharma" autocomplete="off" />

        <label for="motherName">Enter your mother's name:</label>
        <input type="text" id="motherName" placeholder="e.g., Anjali Sharma" autocomplete="off" />

        <label for="fatherLastName">Enter your father's last name:</label>
        <input type="text" id="fatherLastName" placeholder="e.g., Sharma" autocomplete="off" />

        <label for="dob">Enter your date of birth:</label>
        <input type="date" id="dob" max="" />

        <label for="aadharNumber">Enter your Aadhar number (12 digits):</label>
        <input type="text" id="aadharNumber" maxlength="12" placeholder="e.g., 123456789012" autocomplete="off" />

        <label for="photo">Upload your photo:</label>
        <input type="file" id="photo" accept="image/*" />
        <img id="photoPreview" alt="Photo Preview" />

        <button id="generateBtn">Generate PAN ID</button>

        <div id="errorBox" class="error" style="display:none;"></div>
        <div id="panResult" class="result" style="display:none;"></div>
    </div>

<script>
    // Set max date for DOB to today
    document.getElementById("dob").max = new Date().toISOString().split("T")[0];

    function randomLetter() {
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        return letters.charAt(Math.floor(Math.random() * letters.length));
    }

    function sanitizeName(name) {
        return name.replace(/[^a-zA-Z]/g, "").toUpperCase();
    }

    function generatePAN(fullName, fatherLastName, aadhar) {
        // Clean inputs
        let nameClean = sanitizeName(fullName);
        let fatherLastClean = sanitizeName(fatherLastName);
        let aadharClean = aadhar.replace(/\D/g, "");

        // Basic validations
        if(nameClean.length < 3) return { error: "Full name must have at least 3 letters." };
        if(fatherLastClean.length < 1) return { error: "Father's last name cannot be empty." };
        if(aadharClean.length !== 12) return { error: "Aadhar number must be exactly 12 digits." };

        // Extract first 3 letters of full name (contiguous)
        const firstThree = nameClean.substring(0,3);

        // 4th char - type of person, 'P' for individual
        const fourthChar = "P";

        // 5th char - first letter of father's last name
        const fifthChar = fatherLastClean.charAt(0);

        // 4 digits from aadhar (middle 4)
        const digitsPart = aadharClean.substring(4,8);

        // Last char checksum - random letter here
        const lastChar = randomLetter();

        // Construct PAN
        const pan = firstThree + fourthChar + fifthChar + digitsPart + lastChar;
        return { pan };
    }

    // Preview photo when uploaded
    document.getElementById("photo").addEventListener("change", function(event) {
        const preview = document.getElementById("photoPreview");
        const file = event.target.files[0];
        if(file){
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = "block";
            };
            reader.readAsDataURL(file);
        } else {
            preview.src = "";
            preview.style.display = "none";
        }
    });

    document.getElementById("generateBtn").addEventListener("click", () => {
        const fullName = document.getElementById("fullName").value.trim();
        const motherName = document.getElementById("motherName").value.trim();
        const fatherLastName = document.getElementById("fatherLastName").value.trim();
        const dob = document.getElementById("dob").value;
        const aadharNumber = document.getElementById("aadharNumber").value.trim();
        const photoInput = document.getElementById("photo");

        const errorBox = document.getElementById("errorBox");
        const panResult = document.getElementById("panResult");
        errorBox.style.display = "none";
        panResult.style.display = "none";

        // Validate mother name
        if(motherName.length < 1){
            errorBox.textContent = "Mother's name cannot be empty.";
            errorBox.style.display = "block";
            return;
        }
        // Validate DOB
        if(!dob){
            errorBox.textContent = "Date of birth is required.";
            errorBox.style.display = "block";
            return;
        }
        // Validate photo (optional, just check if a file selected)
        if(!photoInput.files || photoInput.files.length === 0){
            errorBox.textContent = "Please upload your photo.";
            errorBox.style.display = "block";
            return;
        }

        // Generate PAN
        const result = generatePAN(fullName, fatherLastName, aadharNumber);
        if(result.error){
            errorBox.textContent = result.error;
            errorBox.style.display = "block";
            return;
        }

        // Build output HTML with all info
        const photoUrl = document.getElementById("photoPreview").src;
        const formattedDOB = new Date(dob).toLocaleDateString(undefined, {day: '2-digit', month: 'short', year: 'numeric'});

        panResult.innerHTML = `
            <div><strong>Your generated PAN ID is:</strong> ${result.pan}</div>
            <hr style="margin:16px 0; border-color:#666;">
            <div><strong>Full Name:</strong> ${fullName}</div>
            <div><strong>Mother's Name:</strong> ${motherName}</div>
            <div><strong>Father's Last Name:</strong> ${fatherLastName}</div>
            <div><strong>Date of Birth:</strong> ${formattedDOB}</div>
            <div style="margin-top:15px;"><strong>Uploaded Photo:</strong></div>
            <img src="${photoUrl}" alt="Uploaded photo" style="max-width:100%; border-radius:10px; border: 2px solid #666; margin-top:8px;">
        `;
        panResult.style.display = "block";
    });
</script>
</body>
</html>
