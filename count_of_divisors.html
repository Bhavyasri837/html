<html>
    <head>
        <script>
            function a()
            {
                var x=parseInt(document.getElementById("r").value);
                document.write("divisors are:<br>");
                var count=0;
                for(var i=1;i<=x;i++)
            {
                if((x%i)==0)
               count++;
            }
            document.write(count);
            }
        </script>
    </head>
    <body>
        enter a number to get its divisors:<input type="text" id="r">
        <button onclick="a()">
            get divisors
        </button>

        </body>
</html>
