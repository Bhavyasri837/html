<html>
    <head>
        <script>
            function a()
            {
            var a=document.getElementById("a").value;
            document.write(a.slice(3,6),"<br>");
            document.write(a.slice(0,6),"<br>");
            }
        </script>
    </head>
    <body>
        <h1> enter the value to slice</h1>
        enter string:<input type="text" id="a">
        <button onclick="a()">click me to see output</button>
    </body>
</html>
