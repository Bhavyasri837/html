<!DOCTYPE html>
<html>
<head>
    <title>Prime Number Checker</title>
    <script>
        function generate_prime() {
            var n = parseInt(document.getElementById("a").value);
            if (isNaN(n) || n < 2) {
                document.getElementById("result").innerHTML = "Please enter a number greater than 1.";
                return;
            }

            var is_prime = true;
            for (var i = 2; i <= Math.sqrt(n); i++) {
                if (n % i === 0) {
                    is_prime = false;
                    break;
                }
            }

            if (is_prime) {
                document.getElementById("result").innerHTML = n + " is a prime number.";
            } else {
                document.getElementById("result").innerHTML = n + " is not a prime number.";
            }
        }
    </script>
</head>
<body>
    <h1>Prime Number Checker</h1>
    Enter a number: <input type="number" id="a" /><br><br>
    <button onclick="generate_prime()">Check Prime</button>
    <p id="result"></p>
</body>
</html>
